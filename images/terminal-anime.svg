<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120" width="160" height="120" role="img" aria-label="Un terminal qui tape une commande, le curseur clignote">
  <style>
    .curseur { animation: clignote 1s steps(2, start) infinite; }
    .l1 { animation: tape 2.4s steps(14, end) infinite; }
    .l2 { animation: apparait 2.4s infinite; }
    @keyframes clignote { to { visibility: hidden; } }
    @keyframes tape { 0% { width: 0; } 35% { width: 70px; } 100% { width: 70px; } }
    @keyframes apparait { 0%, 45% { opacity: 0; } 55%, 100% { opacity: 1; } }
  </style>
  <rect x="4" y="4" width="152" height="112" rx="10" fill="#1f2d3d" stroke="#2dd4bf" stroke-width="3"/>
  <rect x="4" y="4" width="152" height="22" rx="10" fill="#243447"/>
  <rect x="4" y="16" width="152" height="10" fill="#243447"/>
  <circle cx="18" cy="15" r="4" fill="#ff5f57"/>
  <circle cx="31" cy="15" r="4" fill="#febc2e"/>
  <circle cx="44" cy="15" r="4" fill="#28c840"/>
  <text x="18" y="52" font-family="Consolas, monospace" font-size="16" fill="#2dd4bf">$</text>
  <svg x="32" y="38" width="110" height="20" overflow="hidden"><svg class="l1" width="70" height="20" overflow="hidden"><text y="14" font-family="Consolas, monospace" font-size="14" fill="#e6edf3">ls -la</text></svg></svg>
  <text class="l2" x="32" y="76" font-family="Consolas, monospace" font-size="14" fill="#8b98a5">total 4</text>
  <text x="18" y="100" font-family="Consolas, monospace" font-size="16" fill="#2dd4bf">$</text>
  <rect class="curseur" x="32" y="88" width="9" height="16" fill="#e6edf3"/>
</svg>
